<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kotoba — 言葉と考えのノート</title>
<link rel="manifest" href="manifest.json?v=2">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121212">
<style>
  :root {
    --bg: #121212;
    --bg-elevated: #1b1b1b;
    --bg-card: #181818;
    --text: #f2efea;
    --text-dim: #a39c8e;
    --text-faint: #6f6a60;
    --accent: #8fb39b;
    --accent-dim: #5f7d70;
    --danger: #d1665a;
    --border: #2a2a2a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
  }
  body {
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 17px;
    line-height: 1.8;
    min-height: 100vh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #syncBar {
    text-align: center;
    font-size: 11px;
    color: var(--text-faint);
    padding: 4px 8px;
    min-height: 1.4em;
  }
  #syncBar.error, #syncBar.unsynced, #syncBar.offline { color: var(--danger); }
  #syncBar.syncing { color: var(--text-dim); }
  #syncBar.prominent { font-weight: 700; }
  #app {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 16px 32px;
  }
  .screen { display: flex; flex-direction: column; gap: 16px; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 0 4px;
  }
  .topbar-title {
    font-size: 18px;
    color: var(--text);
    flex: 1;
    text-align: center;
  }
  .topbar:has(.backBtn) .topbar-title { text-align: center; }
  button {
    font-family: inherit;
    font-size: 16px;
    color: var(--text);
    background: none;
    border: none;
    cursor: pointer;
  }
  .iconBtn {
    color: var(--accent);
    font-size: 15px;
    padding: 6px 4px;
    white-space: nowrap;
  }
  .backBtn {
    color: var(--text-dim);
    font-size: 15px;
    padding: 6px 4px;
    white-space: nowrap;
  }
  .primaryBtn {
    background: var(--accent);
    color: #121212;
    font-size: 17px;
    padding: 14px;
    border-radius: 10px;
    width: 100%;
    font-weight: 600;
  }
  .primaryBtn:disabled { opacity: 0.4; cursor: default; }
  .secondaryBtn {
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    font-size: 15px;
    padding: 12px;
    border-radius: 10px;
    width: 100%;
    display: block;
    text-align: center;
  }
  .dangerBtn {
    border: 1px solid var(--danger);
    color: var(--danger);
    font-size: 15px;
    padding: 12px;
    border-radius: 10px;
    width: 100%;
  }
  .fileLabel { cursor: pointer; }
  .cardHome {
    background: var(--bg-card);
    border-radius: 18px;
    padding: 36px 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-height: 40vh;
    justify-content: center;
    cursor: pointer;
  }
  .cardText {
    font-size: 20px;
    line-height: 1.9;
    white-space: pre-wrap;
  }
  .cardSource {
    font-size: 14px;
    color: var(--text-dim);
  }
  .cardMyWords {
    font-size: 15px;
    color: var(--accent);
    line-height: 1.8;
    white-space: pre-wrap;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  .cardTags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tagPill {
    font-size: 12px;
    color: var(--text-faint);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
  }
  .emptyMsg {
    color: var(--text-faint);
    font-size: 15px;
    text-align: center;
    padding: 24px 8px;
  }
  .bottomNav {
    display: flex;
    gap: 10px;
  }
  .navBtn {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    color: var(--text-dim);
  }
  input[type="text"], input[type="search"], input[type="password"], input[type="date"], textarea {
    font-family: inherit;
    font-size: 16px;
    background: var(--bg-elevated);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    width: 100%;
  }
  textarea { resize: vertical; line-height: 1.7; }
  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .fieldLabel {
    font-size: 13px;
    color: var(--text-dim);
  }
  .required { color: var(--danger); font-size: 12px; margin-left: 4px; }
  .fieldNote {
    margin: 0;
    font-size: 12px;
    color: var(--text-faint);
  }
  .fieldNote.warn { color: var(--danger); }
  .fieldNote.inlineNote { display: inline; margin-left: 6px; font-size: 11px; }
  .autocompleteField { position: relative; }
  .tagInputRow { display: flex; gap: 8px; align-items: stretch; }
  .tagInputRow input { flex: 1; min-width: 0; }
  .tagAddBtn { width: auto; padding: 12px 16px; white-space: nowrap; }
  .linkResultsList {
    list-style: none;
    margin: 0;
    padding: 4px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    max-height: 180px;
    overflow-y: auto;
  }
  .linkResultItem {
    padding: 10px 8px;
    font-size: 15px;
    border-radius: 6px;
    cursor: pointer;
  }
  .linkResultItem:active { background: var(--bg-card); }
  .linkResultItem { border-bottom: 1px solid var(--border); }
  .linkResultItem:last-child { border-bottom: none; }
  .linkResultText { color: var(--text); }
  .linkResultSource { color: var(--text-faint); font-size: 12px; }
  .chipRow {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 8px 6px 12px;
    font-size: 13px;
    max-width: 100%;
  }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .chip button {
    color: var(--text-faint);
    font-size: 15px;
    line-height: 1;
    padding: 0 2px;
  }
  .editorBody, .detailBody, .settingsBody {
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding-bottom: 24px;
  }
  .detailText {
    font-size: 19px;
    line-height: 1.9;
    white-space: pre-wrap;
  }
  .detailField { display: flex; flex-direction: column; gap: 4px; }
  .detailField > div { white-space: pre-wrap; }
  .detailTags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .detailLinksSection h3, .settingsBody h3 {
    font-size: 15px;
    color: var(--text-dim);
    margin: 0 0 8px;
    font-weight: normal;
  }
  .detailLinksList { display: flex; flex-direction: column; gap: 8px; }
  .detailLinkItem {
    background: var(--bg-card);
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
  }
  .detailLinkItem .lText { font-size: 15px; }
  .detailLinkItem .lSource { font-size: 12px; color: var(--text-faint); margin-top: 4px; }
  .detailActions { display: flex; gap: 10px; margin-top: 8px; }
  hr { border: none; border-top: 1px solid var(--border); margin: 4px 0; }
  .listItems { display: flex; flex-direction: column; gap: 10px; }
  .listItem {
    background: var(--bg-card);
    border-radius: 12px;
    padding: 14px;
    cursor: pointer;
  }
  .listItem .liText {
    font-size: 15px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .listItem .liSource { font-size: 12px; color: var(--text-faint); margin-top: 6px; }
  .tagFilterRow { display: flex; flex-wrap: wrap; gap: 6px; }
  .tagFilterBtn {
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px;
    color: var(--text-dim);
  }
  .tagFilterBtn.selected {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(143, 179, 155, 0.12);
  }
  .candidateChipRow { margin-top: -2px; }
  .candidateChip {
    font-family: inherit;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    color: var(--text-dim);
    background: var(--bg-elevated);
    cursor: pointer;
  }
  .candidateChip:active { background: var(--bg-card); }
  .statRow {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    color: var(--text-dim);
  }
  .statRow span:last-child { color: var(--text); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="syncBar">-</div>
<div id="app">

  <section id="screen-home" class="screen">
    <header class="topbar">
      <div class="topbar-title" style="text-align:left;">kotoba</div>
      <button id="btnAddFromHome" class="iconBtn">＋ 追加</button>
    </header>
    <div id="homeCard" class="cardHome" hidden>
      <div class="cardText" id="homeText"></div>
      <div class="cardSource" id="homeSource"></div>
      <div class="cardMyWords" id="homeMyWords"></div>
      <div class="cardTags" id="homeTags"></div>
    </div>
    <div id="homeEmpty" class="emptyMsg" hidden>まだノートがありません。「＋ 追加」から最初の1枚を書いてみましょう。</div>
    <button id="btnNextCard" class="primaryBtn">次の1枚</button>
    <nav class="bottomNav">
      <button id="navList" class="navBtn">一覧</button>
      <button id="navSettings" class="navBtn">設定</button>
    </nav>
  </section>

  <section id="screen-list" class="screen" hidden>
    <header class="topbar">
      <button class="backBtn" id="backFromList">← 戻る</button>
      <div class="topbar-title">一覧</div>
      <button id="btnAddFromList" class="iconBtn">＋</button>
    </header>
    <input id="listSearch" type="search" placeholder="検索（言葉・出典・自分の言葉）" autocomplete="off">
    <div id="listTagFilter" class="tagFilterRow"></div>
    <div id="listItems" class="listItems"></div>
    <div id="listEmpty" class="emptyMsg" hidden>該当するノートがありません。</div>
  </section>

  <section id="screen-detail" class="screen" hidden>
    <header class="topbar">
      <button class="backBtn" id="backFromDetail">← 戻る</button>
      <div class="topbar-title">詳細</div>
      <div style="width:40px;"></div>
    </header>
    <div class="detailBody">
      <div class="detailText" id="detailText"></div>
      <div class="detailField"><span class="fieldLabel">出典</span><div id="detailSource"></div></div>
      <div class="detailField"><span class="fieldLabel">自分の言葉での一言</span><div id="detailMyWords"></div></div>
      <div class="detailTags" id="detailTags"></div>
      <div class="detailLinksSection">
        <h3>関連ノート</h3>
        <div id="detailLinks" class="detailLinksList"></div>
        <div id="detailLinksEmpty" class="emptyMsg" hidden>関連ノートはありません。</div>
      </div>
      <div class="detailActions">
        <button id="btnEditNote" class="secondaryBtn">編集</button>
        <button id="btnDeleteNote" class="dangerBtn">削除</button>
      </div>
    </div>
  </section>

  <section id="screen-editor" class="screen" hidden>
    <header class="topbar">
      <button class="backBtn" id="backFromEditor">← 戻る</button>
      <div class="topbar-title" id="editorTitle">追加</div>
      <div style="width:40px;"></div>
    </header>
    <div class="editorBody">
      <label class="field">
        <span class="fieldLabel">言葉</span>
        <textarea id="editText" rows="4" placeholder="引用文、または自分の考え" autocomplete="off"></textarea>
      </label>
      <div class="field autocompleteField">
        <span class="fieldLabel">出典</span>
        <input id="editSource" type="text" placeholder="本のタイトル／人名。自分の考えなら「自分」" autocomplete="off">
        <div id="sourceCandidates" class="chipRow candidateChipRow"></div>
      </div>
      <label class="field">
        <span class="fieldLabel">自分の言葉での一言<span class="required">必須</span></span>
        <textarea id="editMyWords" rows="3" placeholder="自分の言葉で一言" autocomplete="off"></textarea>
        <p class="fieldNote warn" id="myWordsHint" hidden>自分の言葉での一言を入力してください（必須）</p>
      </label>
      <div class="field autocompleteField">
        <span class="fieldLabel">タグ<span class="fieldNote inlineNote">（最大3つ・読点/カンマ/スペースで複数入力可）</span></span>
        <div class="tagInputRow">
          <input id="editTagInput" type="text" placeholder="タグを入力（例: 無常、執着）" autocomplete="off">
          <button type="button" id="btnAddTag" class="secondaryBtn tagAddBtn">追加</button>
        </div>
        <p class="fieldNote warn" id="tagLimitHint" hidden>タグは3つまでです</p>
        <div id="editTagChips" class="chipRow"></div>
        <div id="tagCandidates" class="chipRow candidateChipRow"></div>
      </div>
      <div class="field">
        <span class="fieldLabel">関連ノート</span>
        <p class="fieldNote">似た考えのノートを紐づけると、詳細画面でお互いを行き来できます</p>
        <input id="editLinkSearch" type="text" placeholder="検索して追加" autocomplete="off">
        <div id="linkSearchResults" class="linkResultsList" hidden></div>
        <div id="editLinkChips" class="chipRow"></div>
      </div>
      <button id="btnSaveNote" class="primaryBtn" disabled>保存</button>
    </div>
  </section>

  <section id="screen-settings" class="screen" hidden>
    <header class="topbar">
      <button class="backBtn" id="backFromSettings">← 戻る</button>
      <div class="topbar-title">設定</div>
      <div style="width:40px;"></div>
    </header>
    <div class="settingsBody">
      <div class="field">
        <h3>GitHub token</h3>
        <p class="fieldNote">同期先: yutaTasaki/kotoba-data（private）。手順はkotoba-dataリポジトリのREADMEを参照。</p>
        <input id="ghTokenInput" type="text" placeholder="github_pat_..." autocomplete="off" spellcheck="false">
        <button id="btnSaveGhToken" class="secondaryBtn">保存</button>
      </div>
      <hr>
      <div class="field">
        <button id="btnSyncNow" class="secondaryBtn">今すぐ同期</button>
        <button id="btnExport" class="secondaryBtn">data.json をエクスポート（ダウンロード）</button>
        <label class="secondaryBtn fileLabel" for="importFileInput">インポート（読み込み）</label>
        <input id="importFileInput" type="file" accept="application/json" hidden>
      </div>
      <hr>
      <div class="field">
        <button id="btnReloadFromRemote" class="dangerBtn">リモートから読み込み直す（ローカルを破棄）</button>
      </div>
      <hr>
      <div class="field statsField">
        <div class="statRow"><span>ノート総数</span><span id="statNoteCount"></span></div>
        <div class="statRow"><span>タグ数</span><span id="statTagCount"></span></div>
        <div class="statRow"><span>最終同期時刻</span><span id="statLastSync"></span></div>
      </div>
    </div>
  </section>

</div>
<script>
(() => {
  const STORAGE_KEY = 'kotoba_data';
  const BACKUP_KEY = 'kotoba_data_backup';
  const GH_TOKEN_KEY = 'kotoba_ghToken';
  const LAST_SYNC_KEY = 'kotoba_lastSyncAt';
  const PAGE_STAMP_KEY = 'kotoba_pageStamp';
  const GITHUB_OWNER = 'yutaTasaki';
  const GITHUB_REPO = 'kotoba-data';
  const GITHUB_PATH = 'data.json';

  // --- auto-update: same rationale as walk10000 (GitHub Pages caching +
  // iOS home-screen apps resuming a suspended page instead of reloading) ---
  async function checkForUpdate() {
    try {
      const res = await fetch(location.pathname + '?_cb=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
      const stamp = res.headers.get('last-modified') || res.headers.get('etag');
      if (!stamp) return;
      const prev = localStorage.getItem(PAGE_STAMP_KEY);
      if (prev && prev !== stamp) {
        localStorage.setItem(PAGE_STAMP_KEY, stamp);
        location.replace(location.pathname + '?v=' + Date.now());
        return;
      }
      localStorage.setItem(PAGE_STAMP_KEY, stamp);
    } catch (e) {}
  }
  checkForUpdate();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checkForUpdate();
  });
  window.addEventListener('pageshow', () => checkForUpdate());

  function nowIso() { return new Date().toISOString(); }

  function defaultData() {
    return { version: 1, updatedAt: nowIso(), notes: [], deletedIds: [] };
  }

  function normalizeNote(n) {
    return {
      id: String(n.id),
      text: n.text || '',
      source: n.source || '',
      myWords: n.myWords || '',
      tags: Array.isArray(n.tags) ? n.tags.filter(Boolean) : [],
      links: Array.isArray(n.links) ? [...new Set(n.links.filter(Boolean))] : [],
      createdAt: n.createdAt || nowIso(),
      updatedAt: n.updatedAt || n.createdAt || nowIso(),
    };
  }

  function normalizeData(parsed) {
    if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.notes)) return null;
    const deletedIds = Array.isArray(parsed.deletedIds)
      ? parsed.deletedIds.filter((d) => d && d.id).map((d) => ({ id: String(d.id), deletedAt: d.deletedAt || nowIso() }))
      : [];
    return {
      version: parsed.version || 1,
      updatedAt: parsed.updatedAt || nowIso(),
      notes: parsed.notes.filter((n) => n && n.id).map(normalizeNote),
      deletedIds,
    };
  }

  // Primary key holds the live copy; the backup key is only overwritten right
  // after a confirmed-successful sync, so a corrupt primary can be recovered
  // from a known-good, previously-synced snapshot instead of losing data.
  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = normalizeData(JSON.parse(raw));
        if (parsed) return parsed;
      }
    } catch (e) {}
    try {
      const rawBackup = localStorage.getItem(BACKUP_KEY);
      if (rawBackup) {
        const parsedBackup = normalizeData(JSON.parse(rawBackup));
        if (parsedBackup) {
          persistLocal(parsedBackup);
          return parsedBackup;
        }
      }
    } catch (e) {}
    return defaultData();
  }

  function persistLocal(d) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
  }

  function backupData(d) {
    try { localStorage.setItem(BACKUP_KEY, JSON.stringify(d)); } catch (e) {}
  }

  let pendingChangeCount = 0;

  function saveData(d) {
    d.updatedAt = nowIso();
    persistLocal(d);
    pendingChangeCount++;
    scheduleSync();
  }

  let data = loadData();

  function generateId(notes) {
    const d = new Date();
    const prefix = `n_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}_`;
    const existing = new Set(notes.map((n) => n.id));
    let seq = 1;
    while (existing.has(prefix + String(seq).padStart(3, '0'))) seq++;
    return prefix + String(seq).padStart(3, '0');
  }

  function findNote(id) { return data.notes.find((n) => n.id === id) || null; }

  function allTags() {
    const set = new Set();
    data.notes.forEach((n) => n.tags.forEach((t) => set.add(t)));
    return [...set].sort((a, b) => a.localeCompare(b, 'ja'));
  }

  // Links are bidirectional: reconcile the reverse side whenever a note's
  // own links[] changes, so A<->B always agree without the user managing B.
  function applyLinksDiff(noteId, oldLinks, newLinks) {
    const removed = oldLinks.filter((id) => !newLinks.includes(id));
    const added = newLinks.filter((id) => !oldLinks.includes(id));
    removed.forEach((otherId) => {
      const other = findNote(otherId);
      if (other) other.links = other.links.filter((id) => id !== noteId);
    });
    added.forEach((otherId) => {
      const other = findNote(otherId);
      if (other && !other.links.includes(noteId)) other.links.push(noteId);
    });
  }

  function deleteNoteById(id) {
    data.notes.forEach((n) => { n.links = n.links.filter((lid) => lid !== id); });
    data.notes = data.notes.filter((n) => n.id !== id);
    if (!Array.isArray(data.deletedIds)) data.deletedIds = [];
    data.deletedIds = data.deletedIds.filter((d) => d.id !== id);
    data.deletedIds.push({ id, deletedAt: nowIso() });
  }

  function pruneDanglingLinks(d) {
    const ids = new Set(d.notes.map((n) => n.id));
    d.notes.forEach((n) => { n.links = n.links.filter((id) => ids.has(id)); });
  }

  // Per-note merge (not whole-blob updatedAt comparison): union local and
  // remote notes by id, keeping whichever side edited it more recently.
  // An id present on only one side is kept UNLESS the other side recorded an
  // explicit tombstone for it that is at least as new as that note's
  // updatedAt - "missing" alone never means "deleted" (it might just be a
  // note the other device hasn't synced yet).
  function mergeData(a, b) {
    const notesA = new Map(a.notes.map((n) => [n.id, n]));
    const notesB = new Map(b.notes.map((n) => [n.id, n]));
    const delA = new Map((a.deletedIds || []).map((d) => [d.id, d.deletedAt]));
    const delB = new Map((b.deletedIds || []).map((d) => [d.id, d.deletedAt]));

    const allIds = new Set([...notesA.keys(), ...notesB.keys()]);
    const mergedNotes = new Map();

    allIds.forEach((id) => {
      const na = notesA.get(id);
      const nb = notesB.get(id);
      let winner;
      if (na && nb) {
        winner = new Date(na.updatedAt) >= new Date(nb.updatedAt) ? na : nb;
      } else {
        const only = na || nb;
        const tombstoneAt = na ? delB.get(id) : delA.get(id);
        winner = (tombstoneAt && new Date(tombstoneAt) >= new Date(only.updatedAt)) ? null : only;
      }
      if (winner) mergedNotes.set(id, { ...winner, tags: [...winner.tags], links: [...winner.links] });
    });

    const mergedDeleted = new Map();
    delA.forEach((at, id) => mergedDeleted.set(id, at));
    delB.forEach((at, id) => {
      const cur = mergedDeleted.get(id);
      if (!cur || new Date(at) > new Date(cur)) mergedDeleted.set(id, at);
    });
    mergedNotes.forEach((_, id) => mergedDeleted.delete(id));

    const merged = {
      version: 1,
      updatedAt: nowIso(),
      notes: [...mergedNotes.values()],
      deletedIds: [...mergedDeleted.entries()].map(([id, deletedAt]) => ({ id, deletedAt })),
    };
    pruneDanglingLinks(merged);
    return merged;
  }

  // --- GitHub sync (same mechanism as walk10000 -> walk10000-data) ---------
  function getGhToken() { return localStorage.getItem(GH_TOKEN_KEY) || ''; }
  function utf8ToBase64(str) { return btoa(unescape(encodeURIComponent(str))); }
  function base64ToUtf8(b64) { return decodeURIComponent(escape(atob(b64.replace(/\n/g, '')))); }
  function ghHeaders(token) { return { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' }; }

  async function ghGetFile(token) {
    const res = await fetch(
      `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`,
      { headers: ghHeaders(token), cache: 'no-store' }
    );
    if (res.status === 404) return { data: null, sha: null };
    if (!res.ok) throw new Error('GitHub GET failed: ' + res.status);
    const json = await res.json();
    const parsed = normalizeData(JSON.parse(base64ToUtf8(json.content)));
    return { data: parsed, sha: json.sha };
  }

  async function ghPutFile(token, newData, sha) {
    const body = {
      message: `kotoba: ${newData.notes.length} notes`,
      content: utf8ToBase64(JSON.stringify(newData, null, 2)),
    };
    if (sha) body.sha = sha;
    const res = await fetch(
      `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`,
      { method: 'PUT', headers: ghHeaders(token), body: JSON.stringify(body) }
    );
    if (!res.ok) {
      const err = new Error('GitHub PUT failed: ' + res.status);
      err.status = res.status;
      throw err;
    }
    return res.json();
  }

  const syncBarEl = document.getElementById('syncBar');
  function setSyncStatus(state) {
    let text;
    if (state === 'synced') {
      const t = localStorage.getItem(LAST_SYNC_KEY);
      text = t ? `同期済み ${formatDateTime(t)}` : '同期済み';
    } else if (state === 'error') {
      text = pendingChangeCount > 0 ? `同期エラー（未反映 ${pendingChangeCount}件）` : '同期エラー（次回保存時に再試行します）';
    } else if (state === 'syncing') {
      text = '同期中…';
    } else if (state === 'off') {
      text = '';
    } else if (state === 'offline') {
      text = 'オフライン' + (pendingChangeCount > 0 ? `（未反映 ${pendingChangeCount}件）` : '');
    } else {
      text = pendingChangeCount > 1 ? `未同期（${pendingChangeCount}件）` : '未同期';
    }
    syncBarEl.className = state + ((pendingChangeCount >= 2 && state !== 'synced' && state !== 'syncing') ? ' prominent' : '');
    syncBarEl.textContent = text;
  }
  setSyncStatus(getGhToken() ? 'unsynced' : 'off');

  let syncDebounceTimer = null;
  function scheduleSync() {
    if (!getGhToken()) return;
    if (syncDebounceTimer) clearTimeout(syncDebounceTimer);
    setSyncStatus('unsynced');
    syncDebounceTimer = setTimeout(syncNow, 800);
  }

  function emptyRemoteData() {
    return { version: 1, updatedAt: nowIso(), notes: [], deletedIds: [] };
  }

  // Push data (already merged with the latest remote fetch). On a 409 (someone
  // else wrote in between), refetch + remerge + retry exactly once, then give
  // up and let the caller's catch report the error.
  async function pushWithConflictRetry(token, knownSha) {
    try {
      await ghPutFile(token, data, knownSha);
    } catch (e) {
      if (e.status === 409) {
        const remote2 = await ghGetFile(token);
        data = mergeData(data, remote2.data || emptyRemoteData());
        persistLocal(data);
        backupData(data);
        refreshCurrentScreen();
        await ghPutFile(token, data, remote2.sha);
      } else {
        throw e;
      }
    }
  }

  let syncInFlight = false;

  // Always fetches remote and merges it in (per-note, see mergeData) - called
  // on startup, on every visibility-change back to foreground, after every
  // save, and by the manual "今すぐ同期" button. Safety valve: if this
  // device's local notes were empty before merging and remote had any, this
  // cycle only pulls - it never pushes - so a fresh/wiped device can never
  // stomp a populated remote.
  async function syncNow() {
    const token = getGhToken();
    if (!token) { setSyncStatus('off'); return; }
    if (nav.screen === 'editor') return; // never clobber an in-progress edit
    if (syncInFlight) return;
    if (!navigator.onLine) { setSyncStatus('offline'); return; }
    syncInFlight = true;
    setSyncStatus('syncing');
    try {
      const localHadNoNotes = data.notes.length === 0;
      const remote = await ghGetFile(token); // throws on failure -> no push is attempted below
      data = mergeData(data, remote.data || emptyRemoteData());
      persistLocal(data);
      backupData(data);
      refreshCurrentScreen();

      const skipPush = localHadNoNotes && remote.data && remote.data.notes.length > 0;
      if (!skipPush) {
        await pushWithConflictRetry(token, remote.sha);
        backupData(data);
      }
      localStorage.setItem(LAST_SYNC_KEY, nowIso());
      pendingChangeCount = 0;
      setSyncStatus('synced');
    } catch (e) {
      setSyncStatus('error');
    } finally {
      syncInFlight = false;
    }
  }

  // Unconditional overwrite for explicit user actions (import, delete-all
  // equivalents) that have already been confirmed - bypasses merge on
  // purpose, but still retries once on a sha conflict.
  async function hardPushCurrentData() {
    const token = getGhToken();
    if (!token) return;
    if (syncDebounceTimer) clearTimeout(syncDebounceTimer);
    setSyncStatus('syncing');
    try {
      const remote = await ghGetFile(token);
      await pushWithConflictRetry(token, remote.sha);
      backupData(data);
      localStorage.setItem(LAST_SYNC_KEY, nowIso());
      pendingChangeCount = 0;
      setSyncStatus('synced');
    } catch (e) {
      setSyncStatus('error');
    }
  }

  function formatDateTime(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return '-';
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  // --- navigation state -----------------------------------------------------

  function showScreen(name) {

  function refreshCurrentScreen() {
    if (nav.screen === 'home') renderHome();
    else if (nav.screen === 'list') renderList();
    else if (nav.screen === 'detail') renderDetail();
  }

  // --- Home -------------------------------------------------------------
  function pickRandomNoteId(excludeId) {
    const pool = data.notes.filter((n) => n.id !== excludeId);
    const source = pool.length ? pool : data.notes;
    if (!source.length) return null;
    return source[Math.floor(Math.random() * source.length)].id;
  }

    if (!nav.homeNoteId || !findNote(nav.homeNoteId)) {

  document.getElementById('navList').addEventListener('click', () => openList());

  // --- List ---------------------------------------------------------------
  const listState = { search: '', tags: new Set() };

  function openList() {
    showScreen('list');

  }

  function noteSnippet(text, max) {
    const t = text.replace(/\s+/g, ' ').trim();
    return t.length > max ? t.slice(0, max) + '…' : t;
  }

  function renderList() {
    const tagRow = document.getElementById('listTagFilter');
    tagRow.innerHTML = '';
    allTags().forEach((t) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tagFilterBtn' + (listState.tags.has(t) ? ' selected' : '');
      btn.textContent = t;
      btn.addEventListener('click', () => {
        if (listState.tags.has(t)) listState.tags.delete(t); else listState.tags.add(t);
        renderList();
      });
      tagRow.appendChild(btn);
    });

    const q = listState.search.trim().toLowerCase();
    let results = [...data.notes].sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
    if (q) {
      results = results.filter((n) =>
        n.text.toLowerCase().includes(q) || n.source.toLowerCase().includes(q) || n.myWords.toLowerCase().includes(q)
      );

  // --- Detail ---------------------------------------------------------------
  function openDetail(id, originScreen) {

  document.getElementById('btnDeleteNote').addEventListener('click', () => {

  // --- Editor -----------------------------------------------------------
  const editorState = { tags: [], links: [] };
  const editTextEl = document.getElementById('editText');
  const editSourceEl = document.getElementById('editSource');
  const editMyWordsEl = document.getElementById('editMyWords');
  const editTagInputEl = document.getElementById('editTagInput');
  const editLinkSearchEl = document.getElementById('editLinkSearch');
  const btnSaveNote = document.getElementById('btnSaveNote');
  const myWordsHint = document.getElementById('myWordsHint');

  function openEditor(mode, editId, returnScreen) {

    clearTagLimitMessage();

    } else if (nav.editorReturnScreen === 'list') {

  function updateSaveButtonState() {
    const ok = editMyWordsEl.value.trim().length > 0;

  editMyWordsEl.addEventListener('input', updateSaveButtonState);

  document.getElementById('backFromEditor').addEventListener('click', closeEditor);

  btnSaveNote.addEventListener('click', () => {
    const myWords = editMyWordsEl.value.trim();
    if (!myWords) { updateSaveButtonState(); return; }
    commitTagInput(); // capture any tag text left uncommitted in the input
    const text = editTextEl.value.trim();
    const source = editSourceEl.value.trim();
    const newLinks = [...editorState.links];
    const iso = nowIso();

    let savedId;
    if (nav.editorMode === 'edit') {
      const note = findNote(nav.editorEditId);
      const oldLinks = [...note.links];
      note.text = text;
      note.source = source;
      note.myWords = myWords;
      note.tags = [...editorState.tags];
      note.links = newLinks;
      note.updatedAt = iso;
      applyLinksDiff(note.id, oldLinks, newLinks);
      savedId = note.id;
    } else {
      const id = generateId(data.notes);
      const note = { id, text, source, myWords, tags: [...editorState.tags], links: [...newLinks], createdAt: iso, updatedAt: iso };
      data.notes.push(note);
      applyLinksDiff(id, [], newLinks);
      savedId = id;
    }

    saveData(data);

    if (nav.editorMode === 'new') {
      openDetail(savedId, nav.editorReturnScreen === 'list' ? 'list' : 'home');
    } else {
      nav.detailId = savedId;
      showScreen('detail');
      renderDetail();
    }
  });

  // tag/source candidates: always-visible chips of previously-used values,
  // ranked by usage count (ties broken by most-recently-used), narrowed by
  // whatever's currently typed. Tapping one selects it; free typed text is
  // still accepted as-is (source) or via Enter (tag).
  function sourceUsageStats() {
    const stats = new Map();
    data.notes.forEach((n) => {
      if (!n.source) return;
      const s = stats.get(n.source) || { count: 0, lastUsed: '' };
      s.count++;
      if (n.updatedAt > s.lastUsed) s.lastUsed = n.updatedAt;
      stats.set(n.source, s);
    });
    if (!stats.has('自分')) stats.set('自分', { count: 0, lastUsed: '' });
    return stats;
  }

  function tagUsageStats() {
    const stats = new Map();
    data.notes.forEach((n) => {
      n.tags.forEach((t) => {
        const s = stats.get(t) || { count: 0, lastUsed: '' };
        s.count++;
        if (n.updatedAt > s.lastUsed) s.lastUsed = n.updatedAt;
        stats.set(t, s);
      });
    });
    return stats;
  }

  function rankByUsage(stats) {
    return [...stats.entries()]
      .sort((a, b) => b[1].count - a[1].count || (a[1].lastUsed < b[1].lastUsed ? 1 : -1))
      .map(([key]) => key);
  }

  function renderCandidateChips(container, candidates, onPick) {
    container.innerHTML = '';
    candidates.slice(0, 24).forEach((value) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'candidateChip';
      btn.textContent = value;
      btn.addEventListener('click', () => onPick(value));
      container.appendChild(btn);
    });
  }

  const sourceCandidatesEl = document.getElementById('sourceCandidates');
  function renderSourceCandidates() {
    const q = editSourceEl.value.trim().toLowerCase();
    let candidates = rankByUsage(sourceUsageStats());
    if (q) candidates = candidates.filter((s) => s.toLowerCase().includes(q));
    renderCandidateChips(sourceCandidatesEl, candidates, (v) => {
      editSourceEl.value = v;
      renderSourceCandidates();
    });
  }
  editSourceEl.addEventListener('input', renderSourceCandidates);

  const TAG_MAX = 3;
  const tagLimitHintEl = document.getElementById('tagLimitHint');
  function showTagLimitMessage() { tagLimitHintEl.hidden = false; }
  function clearTagLimitMessage() { tagLimitHintEl.hidden = true; }

  // Accepts 、 (touten), half/full-width commas, and any whitespace (which in
  // JS regex \s already includes the full-width ideographic space) as
  // separators, so "無常 執着 死" and "無常、執着" both yield 3 tags.
  function splitTagInput(raw) {
    return raw.split(/[、,，\s]+/u).map((s) => s.trim()).filter(Boolean);
  }

  function renderTagChips() {
    const row = document.getElementById('editTagChips');
    row.innerHTML = '';
    editorState.tags.forEach((t) => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      const label = document.createElement('span');
      label.textContent = t;
      chip.appendChild(label);
      const rm = document.createElement('button');
      rm.type = 'button';
      rm.textContent = '×';
      rm.addEventListener('click', () => {
        editorState.tags = editorState.tags.filter((x) => x !== t);
        if (editorState.tags.length < TAG_MAX) clearTagLimitMessage();
        renderTagChips();
        renderTagCandidates();
      });
      chip.appendChild(rm);
      row.appendChild(chip);
    });
  }

  // Adds as many of the given (already-split) tag tokens as fit under
  // TAG_MAX, in order, skipping duplicates silently; surfaces the shared
  // "タグは3つまでです" message whenever the cap is what stopped a token
  // from being added (never for a plain duplicate).
  function addTagTokens(tokens) {
    if (!tokens.length) return;
    if (editorState.tags.length >= TAG_MAX) { showTagLimitMessage(); return; }
    let hitLimit = false;
    for (const t of tokens) {
      if (editorState.tags.length >= TAG_MAX) { hitLimit = true; break; }
      if (!editorState.tags.includes(t)) editorState.tags.push(t);
    }
    if (hitLimit) showTagLimitMessage(); else clearTagLimitMessage();
    renderTagChips();
    renderTagCandidates();
  }

  // Commits whatever's currently typed (possibly several tags at once) into
  // editorState.tags and clears the field. Used by Enter, the 追加 button,
  // and automatically at save time so unconfirmed text is never lost.
  function commitTagInput() {
    const raw = editTagInputEl.value;
    if (!raw.trim()) return;
    addTagTokens(splitTagInput(raw));
    editTagInputEl.value = '';
    renderTagCandidates();
  }

  const tagCandidatesEl = document.getElementById('tagCandidates');
  function renderTagCandidates() {
    const q = editTagInputEl.value.trim().toLowerCase();
    const excludeSet = new Set(editorState.tags);
    let candidates = rankByUsage(tagUsageStats()).filter((t) => !excludeSet.has(t));
    if (q) candidates = candidates.filter((t) => t.toLowerCase().includes(q));
    renderCandidateChips(tagCandidatesEl, candidates, (v) => {
      if (editorState.tags.length >= TAG_MAX) { showTagLimitMessage(); return; }
      editorState.tags.push(v);
      clearTagLimitMessage();
      editTagInputEl.value = '';
      renderTagChips();
      renderTagCandidates();
      editTagInputEl.focus();
    });
  }

  // Live delimiter commit: typing 、/,/，/whitespace confirms whatever comes
  // before it as a tag immediately, not just on Enter/save. Guarded by IME
  // composition state so selecting a kanji conversion candidate with the
  // space bar doesn't get mistaken for "confirm tag" mid-composition.
  let tagInputComposing = false;
  function liveCommitFromInput() {
    const val = editTagInputEl.value;
    if (!/[、,，\s]/u.test(val)) return;
    const endsWithDelimiter = /[、,，\s]$/u.test(val);
    const parts = splitTagInput(val);
    if (endsWithDelimiter) {
      addTagTokens(parts);
      editTagInputEl.value = '';
    } else if (parts.length > 1) {
      const trailing = parts.pop();
      addTagTokens(parts);
      editTagInputEl.value = trailing;
    }
  }
  editTagInputEl.addEventListener('compositionstart', () => { tagInputComposing = true; });
  editTagInputEl.addEventListener('compositionend', () => {
    tagInputComposing = false;
    liveCommitFromInput();
    renderTagCandidates();
  });
  editTagInputEl.addEventListener('input', () => {
    if (!tagInputComposing) liveCommitFromInput();
    renderTagCandidates();
  });
  editTagInputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      commitTagInput();
    }
  });
  document.getElementById('btnAddTag').addEventListener('click', () => {
    commitTagInput();
    editTagInputEl.focus();
  });

  // related-note picker
  const linkResultsEl = document.getElementById('linkSearchResults');
  function hideLinkResults() { linkResultsEl.hidden = true; linkResultsEl.innerHTML = ''; }

  function renderLinkChips() {
    const row = document.getElementById('editLinkChips');
    row.innerHTML = '';
    editorState.links.map(findNote).filter(Boolean).forEach((n) => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      const label = document.createElement('span');
      label.textContent = noteSnippet(n.text, 24);
      chip.appendChild(label);
      const rm = document.createElement('button');
      rm.type = 'button';
      rm.textContent = '×';
      rm.addEventListener('click', () => {
        editorState.links = editorState.links.filter((id) => id !== n.id);
        renderLinkChips();
      });
      chip.appendChild(rm);
      row.appendChild(chip);
    });
  }

  editLinkSearchEl.addEventListener('input', () => {
    const q = editLinkSearchEl.value.trim().toLowerCase();
    if (!q) { hideLinkResults(); return; }
    const excludeId = nav.editorMode === 'edit' ? nav.editorEditId : null;
    const matches = data.notes.filter((n) =>
      n.id !== excludeId &&
      !editorState.links.includes(n.id) &&
      (n.text.toLowerCase().includes(q) || n.source.toLowerCase().includes(q) || n.myWords.toLowerCase().includes(q))
    ).slice(0, 10);
    linkResultsEl.innerHTML = '';
    if (!matches.length) { hideLinkResults(); return; }
    matches.forEach((n) => {
      const item = document.createElement('div');
      item.className = 'linkResultItem';
      const t = document.createElement('div');
      t.className = 'linkResultText';
      t.textContent = noteSnippet(n.text, 50);
      item.appendChild(t);
      if (n.source) {
        const s = document.createElement('div');
        s.className = 'linkResultSource';
        s.textContent = n.source;
        item.appendChild(s);
      }
      item.addEventListener('mousedown', (e) => {
        e.preventDefault();
        editorState.links.push(n.id);
        renderLinkChips();
        editLinkSearchEl.value = '';
        hideLinkResults();
      });
      linkResultsEl.appendChild(item);
    });
    linkResultsEl.hidden = false;
  });
  editLinkSearchEl.addEventListener('blur', () => setTimeout(hideLinkResults, 150));

  // --- Settings ---------------------------------------------------------
  function openSettings() {
    showScreen('settings');
    document.getElementById('ghTokenInput').value = getGhToken();
    document.getElementById('statNoteCount').textContent = data.notes.length;
    document.getElementById('statTagCount').textContent = allTags().length;
    const lastSync = localStorage.getItem(LAST_SYNC_KEY);
    document.getElementById('statLastSync').textContent = lastSync ? formatDateTime(lastSync) : '-';
  }

  document.getElementById('backFromSettings').addEventListener('click', goHome);

  document.getElementById('btnSaveGhToken').addEventListener('click', () => {
    const v = document.getElementById('ghTokenInput').value.trim();
    if (v) {
      localStorage.setItem(GH_TOKEN_KEY, v);
      alert('保存しました');
      syncNow().then(() => openSettings());
    } else {
      localStorage.removeItem(GH_TOKEN_KEY);
      setSyncStatus('off');
      alert('保存しました');
    }
  });

  document.getElementById('btnSyncNow').addEventListener('click', () => {
    syncNow().then(() => openSettings());
  });

  document.getElementById('btnReloadFromRemote').addEventListener('click', async () => {
    const token = getGhToken();
    if (!token) { alert('先にGitHub tokenを設定してください'); return; }
    if (!confirm('ローカルのデータを破棄して、リモートの内容で置き換えます。よろしいですか？この操作は取り消せません。')) return;
    setSyncStatus('syncing');
    try {
      const remote = await ghGetFile(token);
      data = remote.data || defaultData();
      persistLocal(data);
      backupData(data);
      pendingChangeCount = 0;
      localStorage.setItem(LAST_SYNC_KEY, nowIso());
      setSyncStatus('synced');
      openSettings();
      alert('リモートの内容を読み込みました');
    } catch (e) {
      setSyncStatus('error');
      alert('読み込みに失敗しました');
    }
  });

  document.getElementById('btnExport').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    a.href = url;
    a.download = `kotoba_data_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  });

  document.getElementById('importFileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = normalizeData(JSON.parse(text));
      if (!parsed) throw new Error('invalid shape');
      if (!confirm('現在のデータを、読み込んだ内容で上書きします。よろしいですか？')) return;
      data = parsed;
      persistLocal(data);
      await hardPushCurrentData();
      openSettings();
      alert('インポートしました');
    } catch (err) {
      alert('JSONの読み込みに失敗しました');
    }
  });

  // --- boot ---------------------------------------------------------------
  goHome();
  syncNow();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') syncNow();
  });
  window.addEventListener('online', () => syncNow());
  window.addEventListener('offline', () => setSyncStatus('offline'));
})();
</script>
</body>
</html>
