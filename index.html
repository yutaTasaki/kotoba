<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kotoba — 言葉と考えのノート</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121212">
<style>
  :root {
    --bg: #121212;
    --bg-elevated: #1b1b1b;
    --bg-card: #181818;
    --text: #f2efea;
    --text-dim: #a39c8e;
    --text-faint: #6f6a60;
    --accent: #8fb39b;
    --accent-dim: #5f7d70;
    --danger: #d1665a;
    --border: #2a2a2a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
  }
  body {
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 17px;
    line-height: 1.8;
    min-height: 100vh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #syncBar {
    text-align: center;
    font-size: 11px;
    color: var(--text-faint);
    padding: 4px 8px;
    min-height: 1.4em;
  }
  #syncBar.error, #syncBar.unsynced { color: var(--danger); }
  #syncBar.syncing { color: var(--text-dim); }
  #app {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 16px 32px;
  }
  .screen { display: flex; flex-direction: column; gap: 16px; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 0 4px;
  }
  .topbar-title {
    font-size: 18px;
    color: var(--text);
    flex: 1;
    text-align: center;
  }
  .topbar:has(.backBtn) .topbar-title { text-align: center; }
  button {
    font-family: inherit;
    font-size: 16px;
    color: var(--text);
    background: none;
    border: none;
    cursor: pointer;
  }
  .iconBtn {
    color: var(--accent);
    font-size: 15px;
    padding: 6px 4px;
    white-space: nowrap;
  }
  .backBtn {
    color: var(--text-dim);
    font-size: 15px;
    padding: 6px 4px;
    white-space: nowrap;
  }
  .primaryBtn {
    background: var(--accent);
    color: #121212;
    font-size: 17px;
    padding: 14px;
    border-radius: 10px;
    width: 100%;
    font-weight: 600;
  }
  .primaryBtn:disabled { opacity: 0.4; cursor: default; }
  .secondaryBtn {
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    font-size: 15px;
    padding: 12px;
    border-radius: 10px;
    width: 100%;
    display: block;
    text-align: center;
  }
  .dangerBtn {
    border: 1px solid var(--danger);
    color: var(--danger);
    font-size: 15px;
    padding: 12px;
    border-radius: 10px;
    width: 100%;
  }
  .fileLabel { cursor: pointer; }
  .cardHome {
    background: var(--bg-card);
    border-radius: 18px;
    padding: 36px 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-height: 40vh;
    justify-content: center;
    cursor: pointer;
  }
  .cardText {
    font-size: 20px;
    line-height: 1.9;
    white-space: pre-wrap;
  }
  .cardSource {
    font-size: 14px;
    color: var(--text-dim);
  }
  .cardMyWords {
    font-size: 15px;
    color: var(--accent);
    line-height: 1.8;
    white-space: pre-wrap;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  .cardTags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tagPill {
    font-size: 12px;
    color: var(--text-faint);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
  }
  .emptyMsg {
    color: var(--text-faint);
    font-size: 15px;
    text-align: center;
    padding: 24px 8px;
  }
  .bottomNav {
    display: flex;
    gap: 10px;
  }
  .navBtn {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    color: var(--text-dim);
  }
  input[type="text"], input[type="search"], input[type="password"], input[type="date"], textarea {
    font-family: inherit;
    font-size: 16px;
    background: var(--bg-elevated);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    width: 100%;
  }
  textarea { resize: vertical; line-height: 1.7; }
  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .fieldLabel {
    font-size: 13px;
    color: var(--text-dim);
  }
  .required { color: var(--danger); font-size: 12px; margin-left: 4px; }
  .fieldNote {
    margin: 0;
    font-size: 12px;
    color: var(--text-faint);
  }
  .fieldNote.warn { color: var(--danger); }
  .autocompleteField { position: relative; }
  .suggestList, .linkResultsList {
    list-style: none;
    margin: 0;
    padding: 4px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    max-height: 180px;
    overflow-y: auto;
  }
  .suggestList { position: absolute; left: 0; right: 0; top: 100%; z-index: 5; }
  .suggestList li, .linkResultItem {
    padding: 10px 8px;
    font-size: 15px;
    border-radius: 6px;
    cursor: pointer;
  }
  .suggestList li:active, .linkResultItem:active { background: var(--bg-card); }
  .linkResultItem { border-bottom: 1px solid var(--border); }
  .linkResultItem:last-child { border-bottom: none; }
  .linkResultText { color: var(--text); }
  .linkResultSource { color: var(--text-faint); font-size: 12px; }
  .chipRow {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 8px 6px 12px;
    font-size: 13px;
    max-width: 100%;
  }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .chip button {
    color: var(--text-faint);
    font-size: 15px;
    line-height: 1;
    padding: 0 2px;
  }
  .editorBody, .detailBody, .settingsBody {
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding-bottom: 24px;
  }
  .detailText {
    font-size: 19px;
    line-height: 1.9;
    white-space: pre-wrap;
  }
  .detailField { display: flex; flex-direction: column; gap: 4px; }
  .detailField > div { white-space: pre-wrap; }
  .detailTags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .detailLinksSection h3, .settingsBody h3 {
    font-size: 15px;
    color: var(--text-dim);
    margin: 0 0 8px;
    font-weight: normal;
  }
  .detailLinksList { display: flex; flex-direction: column; gap: 8px; }
  .detailLinkItem {
    background: var(--bg-card);
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
  }
  .detailLinkItem .lText { font-size: 15px; }
  .detailLinkItem .lSource { font-size: 12px; color: var(--text-faint); margin-top: 4px; }
  .detailActions { display: flex; gap: 10px; margin-top: 8px; }
  hr { border: none; border-top: 1px solid var(--border); margin: 4px 0; }
  .listItems { display: flex; flex-direction: column; gap: 10px; }
  .listItem {
    background: var(--bg-card);
    border-radius: 12px;
    padding: 14px;
    cursor: pointer;
  }
  .listItem .liText {
    font-size: 15px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .listItem .liSource { font-size: 12px; color: var(--text-faint); margin-top: 6px; }
  .tagFilterRow { display: flex; flex-wrap: wrap; gap: 6px; }
  .tagFilterBtn {
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px;
    color: var(--text-dim);
  }
  .tagFilterBtn.selected {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(143, 179, 155, 0.12);
  }
  .statRow {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    color: var(--text-dim);
  }
  .statRow span:last-child { color: var(--text); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="syncBar">-</div>
<div id="app">

  <section id="screen-home" class="screen">
    <header class="topbar">
      <div class="topbar-title" style="text-align:left;">kotoba</div>
      <button id="btnAddFromHome" class="iconBtn">＋ 追加</button>
    </header>
    <div id="homeCard" class="cardHome" hidden>
      <div class="cardText" id="homeText"></div>
      <div class="cardSource" id="homeSource"></div>
      <div class="cardMyWords" id="homeMyWords"></div>
      <div class="cardTags" id="homeTags"></div>
    </div>
    <div id="homeEmpty" class="emptyMsg" hidden>まだノートがありません。「＋ 追加」から最初の1枚を書いてみましょう。</div>
    <button id="btnNextCard" class="primaryBtn">次の1枚</button>
    <nav class="bottomNav">
      <button id="navList" class="navBtn">一覧</button>
      <button id="navSettings" class="navBtn">設定</button>
    </nav>
  </section>

  <section id="screen-list" class="screen" hidden>
    <header class="topbar">
      <button class="backBtn" id="backFromList">← 戻る</button>
      <div class="topbar-title">一覧</div>
      <button id="btnAddFromList" class="iconBtn">＋</button>
    </header>
    <input id="listSearch" type="search" placeholder="検索（言葉・出典・自分の言葉）">
    <div id="listTagFilter" class="tagFilterRow"></div>
    <div id="listItems" class="listItems"></div>
    <div id="listEmpty" class="emptyMsg" hidden>該当するノートがありません。</div>
  </section>

  <section id="screen-detail" class="screen" hidden>
    <header class="topbar">
      <button class="backBtn" id="backFromDetail">← 戻る</button>
      <div class="topbar-title">詳細</div>
      <div style="width:40px;"></div>
    </header>
    <div class="detailBody">
      <div class="detailText" id="detailText"></div>
      <div class="detailField"><span class="fieldLabel">出典</span><div id="detailSource"></div></div>
      <div class="detailField"><span class="fieldLabel">自分の言葉での一言</span><div id="detailMyWords"></div></div>
      <div class="detailTags" id="detailTags"></div>
      <div class="detailLinksSection">
        <h3>関連ノート</h3>
        <div id="detailLinks" class="detailLinksList"></div>
        <div id="detailLinksEmpty" class="emptyMsg" hidden>関連ノートはありません。</div>
      </div>
      <div class="detailActions">
        <button id="btnEditNote" class="secondaryBtn">編集</button>
        <button id="btnDeleteNote" class="dangerBtn">削除</button>
      </div>
    </div>
  </section>

  <section id="screen-editor" class="screen" hidden>
    <header class="topbar">
      <button class="backBtn" id="backFromEditor">← 戻る</button>
      <div class="topbar-title" id="editorTitle">追加</div>
      <div style="width:40px;"></div>
    </header>
    <div class="editorBody">
      <label class="field">
        <span class="fieldLabel">言葉</span>
        <textarea id="editText" rows="4" placeholder="引用文、または自分の考え"></textarea>
      </label>
      <div class="field autocompleteField">
        <span class="fieldLabel">出典</span>
        <input id="editSource" type="text" placeholder="本のタイトル／人名。自分の考えなら「自分」" autocomplete="off">
        <ul id="sourceSuggest" class="suggestList" hidden></ul>
      </div>
      <label class="field">
        <span class="fieldLabel">自分の言葉での一言<span class="required">必須</span></span>
        <textarea id="editMyWords" rows="3" placeholder="自分の言葉で一言"></textarea>
        <p class="fieldNote warn" id="myWordsHint" hidden>自分の言葉での一言を入力してください（必須）</p>
      </label>
      <div class="field autocompleteField">
        <span class="fieldLabel">タグ</span>
        <input id="editTagInput" type="text" placeholder="タグを入力してEnter" autocomplete="off">
        <ul id="tagSuggest" class="suggestList" hidden></ul>
        <div id="editTagChips" class="chipRow"></div>
      </div>
      <div class="field">
        <span class="fieldLabel">関連ノート</span>
        <input id="editLinkSearch" type="text" placeholder="検索して追加" autocomplete="off">
        <div id="linkSearchResults" class="linkResultsList" hidden></div>
        <div id="editLinkChips" class="chipRow"></div>
      </div>
      <button id="btnSaveNote" class="primaryBtn" disabled>保存</button>
    </div>
  </section>

  <section id="screen-settings" class="screen" hidden>
    <header class="topbar">
      <button class="backBtn" id="backFromSettings">← 戻る</button>
      <div class="topbar-title">設定</div>
      <div style="width:40px;"></div>
    </header>
    <div class="settingsBody">
      <div class="field">
        <h3>GitHub token</h3>
        <p class="fieldNote">同期先: yutaTasaki/kotoba-data（private）。手順はkotoba-dataリポジトリのREADMEを参照。</p>
        <input id="ghTokenInput" type="password" placeholder="github_pat_...">
        <button id="btnSaveGhToken" class="secondaryBtn">保存</button>
      </div>
      <hr>
      <div class="field">
        <button id="btnSyncNow" class="secondaryBtn">今すぐ同期</button>
        <button id="btnExport" class="secondaryBtn">data.json をエクスポート（ダウンロード）</button>
        <label class="secondaryBtn fileLabel" for="importFileInput">インポート（読み込み）</label>
        <input id="importFileInput" type="file" accept="application/json" hidden>
      </div>
      <hr>
      <div class="field statsField">
        <div class="statRow"><span>ノート総数</span><span id="statNoteCount"></span></div>
        <div class="statRow"><span>タグ数</span><span id="statTagCount"></span></div>
        <div class="statRow"><span>最終同期時刻</span><span id="statLastSync"></span></div>
      </div>
    </div>
  </section>

</div>
<script>
(() => {
  const STORAGE_KEY = 'kotoba_data';
  const GH_TOKEN_KEY = 'kotoba_ghToken';
  const LAST_SYNC_KEY = 'kotoba_lastSyncAt';
  const PAGE_STAMP_KEY = 'kotoba_pageStamp';
  const GITHUB_OWNER = 'yutaTasaki';
  const GITHUB_REPO = 'kotoba-data';
  const GITHUB_PATH = 'data.json';

  // --- auto-update: same rationale as walk10000 (GitHub Pages caching +
  // iOS home-screen apps resuming a suspended page instead of reloading) ---
  async function checkForUpdate() {
    try {
      const res = await fetch(location.pathname + '?_cb=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
      const stamp = res.headers.get('last-modified') || res.headers.get('etag');
      if (!stamp) return;
      const prev = localStorage.getItem(PAGE_STAMP_KEY);
      if (prev && prev !== stamp) {
        localStorage.setItem(PAGE_STAMP_KEY, stamp);
        location.replace(location.pathname + '?v=' + Date.now());
        return;
      }
      localStorage.setItem(PAGE_STAMP_KEY, stamp);
    } catch (e) {}
  }
  checkForUpdate();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checkForUpdate();
  });
  window.addEventListener('pageshow', () => checkForUpdate());

  function nowIso() { return new Date().toISOString(); }

  function defaultData() {
    return { version: 1, updatedAt: nowIso(), notes: [] };
  }

  function normalizeNote(n) {
    return {
      id: String(n.id),
      text: n.text || '',
      source: n.source || '',
      myWords: n.myWords || '',
      tags: Array.isArray(n.tags) ? n.tags.filter(Boolean) : [],
      links: Array.isArray(n.links) ? [...new Set(n.links.filter(Boolean))] : [],
      createdAt: n.createdAt || nowIso(),
      updatedAt: n.updatedAt || n.createdAt || nowIso(),
    };
  }

  function normalizeData(parsed) {
    if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.notes)) return null;
    return {
      version: parsed.version || 1,
      updatedAt: parsed.updatedAt || nowIso(),
      notes: parsed.notes.filter((n) => n && n.id).map(normalizeNote),
    };
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultData();
      const parsed = normalizeData(JSON.parse(raw));
      return parsed || defaultData();
    } catch (e) {
      return defaultData();
    }
  }

  function persistLocal(d) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
  }

  function saveData(d) {
    d.updatedAt = nowIso();
    persistLocal(d);
    scheduleSync();
  }

  let data = loadData();

  function generateId(notes) {
    const d = new Date();
    const prefix = `n_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}_`;
    const existing = new Set(notes.map((n) => n.id));
    let seq = 1;
    while (existing.has(prefix + String(seq).padStart(3, '0'))) seq++;
    return prefix + String(seq).padStart(3, '0');
  }

  function findNote(id) { return data.notes.find((n) => n.id === id) || null; }

  function allTags() {
    const set = new Set();
    data.notes.forEach((n) => n.tags.forEach((t) => set.add(t)));
    return [...set].sort((a, b) => a.localeCompare(b, 'ja'));
  }

  function allSources() {
    const set = new Set();
    data.notes.forEach((n) => { if (n.source) set.add(n.source); });
    return [...set].sort((a, b) => a.localeCompare(b, 'ja'));
  }

  // Links are bidirectional: reconcile the reverse side whenever a note's
  // own links[] changes, so A<->B always agree without the user managing B.
  function applyLinksDiff(noteId, oldLinks, newLinks) {
    const removed = oldLinks.filter((id) => !newLinks.includes(id));
    const added = newLinks.filter((id) => !oldLinks.includes(id));
    removed.forEach((otherId) => {
      const other = findNote(otherId);
      if (other) other.links = other.links.filter((id) => id !== noteId);
    });
    added.forEach((otherId) => {
      const other = findNote(otherId);
      if (other && !other.links.includes(noteId)) other.links.push(noteId);
    });
  }

  function deleteNoteById(id) {
    data.notes.forEach((n) => { n.links = n.links.filter((lid) => lid !== id); });
    data.notes = data.notes.filter((n) => n.id !== id);
  }

  // --- GitHub sync (same mechanism as walk10000 -> walk10000-data) ---------
  function getGhToken() { return localStorage.getItem(GH_TOKEN_KEY) || ''; }
  function utf8ToBase64(str) { return btoa(unescape(encodeURIComponent(str))); }
  function base64ToUtf8(b64) { return decodeURIComponent(escape(atob(b64.replace(/\n/g, '')))); }
  function ghHeaders(token) { return { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' }; }

  async function ghGetFile(token) {
    const res = await fetch(
      `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`,
      { headers: ghHeaders(token), cache: 'no-store' }
    );
    if (res.status === 404) return { data: null, sha: null };
    if (!res.ok) throw new Error('GitHub GET failed: ' + res.status);
    const json = await res.json();
    const parsed = normalizeData(JSON.parse(base64ToUtf8(json.content)));
    return { data: parsed, sha: json.sha };
  }

  async function ghPutFile(token, newData, sha) {
    const body = {
      message: `kotoba: ${newData.notes.length} notes`,
      content: utf8ToBase64(JSON.stringify(newData, null, 2)),
    };
    if (sha) body.sha = sha;
    const res = await fetch(
      `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`,
      { method: 'PUT', headers: ghHeaders(token), body: JSON.stringify(body) }
    );
    if (!res.ok) throw new Error('GitHub PUT failed: ' + res.status);
    return res.json();
  }

  const syncBarEl = document.getElementById('syncBar');
  function setSyncStatus(state) {
    syncBarEl.className = state;
    if (state === 'synced') {
      const t = localStorage.getItem(LAST_SYNC_KEY);
      syncBarEl.textContent = t ? `同期済み ${formatDateTime(t)}` : '同期済み';
    } else if (state === 'error') syncBarEl.textContent = '同期エラー（次回保存時に再試行します）';
    else if (state === 'syncing') syncBarEl.textContent = '同期中…';
    else if (state === 'off') syncBarEl.textContent = '';
    else syncBarEl.textContent = '未同期';
  }
  setSyncStatus(getGhToken() ? 'unsynced' : 'off');

  let syncDebounceTimer = null;
  function scheduleSync() {
    if (!getGhToken()) return;
    if (syncDebounceTimer) clearTimeout(syncDebounceTimer);
    setSyncStatus('unsynced');
    syncDebounceTimer = setTimeout(syncNow, 800);
  }

  // Pull-if-remote-newer, else push local. Reused for startup, every save,
  // and the manual "今すぐ同期" button, exactly like walk10000's syncNow().
  async function syncNow() {
    const token = getGhToken();
    if (!token) return;
    if (nav.screen === 'editor') return; // never clobber an in-progress edit
    setSyncStatus('syncing');
    try {
      const remote = await ghGetFile(token);
      if (remote.data && new Date(remote.data.updatedAt) > new Date(data.updatedAt)) {
        data = remote.data;
        persistLocal(data);
        refreshCurrentScreen();
      } else {
        await ghPutFile(token, data, remote.sha);
      }
      localStorage.setItem(LAST_SYNC_KEY, nowIso());
      setSyncStatus('synced');
    } catch (e) {
      setSyncStatus('error');
    }
  }

  async function forcePush() {
    const token = getGhToken();
    if (!token) return;
    if (syncDebounceTimer) clearTimeout(syncDebounceTimer);
    setSyncStatus('syncing');
    try {
      const remote = await ghGetFile(token);
      await ghPutFile(token, data, remote.sha);
      localStorage.setItem(LAST_SYNC_KEY, nowIso());
      setSyncStatus('synced');
    } catch (e) {
      setSyncStatus('error');
    }
  }

  function formatDateTime(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return '-';
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  // --- navigation state -----------------------------------------------------
  const nav = {
    screen: 'home',
    homeNoteId: null,
    detailId: null,
    detailStack: [],
    detailOrigin: 'home',
    editorMode: 'new',
    editorEditId: null,
    editorReturnScreen: 'home',
  };

  function showScreen(name) {
    ['home', 'list', 'detail', 'editor', 'settings'].forEach((s) => {
      document.getElementById('screen-' + s).hidden = s !== name;
    });
    nav.screen = name;
  }

  function refreshCurrentScreen() {
    if (nav.screen === 'home') renderHome();
    else if (nav.screen === 'list') renderList();
    else if (nav.screen === 'detail') renderDetail();
  }

  // --- Home -------------------------------------------------------------
  function pickRandomNoteId(excludeId) {
    const pool = data.notes.filter((n) => n.id !== excludeId);
    const source = pool.length ? pool : data.notes;
    if (!source.length) return null;
    return source[Math.floor(Math.random() * source.length)].id;
  }

  function renderHome() {
    if (!nav.homeNoteId || !findNote(nav.homeNoteId)) {
      nav.homeNoteId = pickRandomNoteId(null);
    }
    const note = nav.homeNoteId ? findNote(nav.homeNoteId) : null;
    document.getElementById('homeCard').hidden = !note;
    document.getElementById('homeEmpty').hidden = !!note;
    document.getElementById('btnNextCard').hidden = !note;
    if (note) {
      document.getElementById('homeText').textContent = note.text;
      document.getElementById('homeSource').textContent = note.source;
      document.getElementById('homeSource').hidden = !note.source;
      document.getElementById('homeMyWords').textContent = note.myWords;
      renderTagPills(document.getElementById('homeTags'), note.tags);
    }
  }

  function renderTagPills(container, tags) {
    container.innerHTML = '';
    tags.forEach((t) => {
      const el = document.createElement('span');
      el.className = 'tagPill';
      el.textContent = t;
      container.appendChild(el);
    });
  }

  function goHome() {
    showScreen('home');
    renderHome();
  }

  document.getElementById('btnNextCard').addEventListener('click', () => {
    nav.homeNoteId = pickRandomNoteId(nav.homeNoteId);
    renderHome();
  });
  document.getElementById('homeCard').addEventListener('click', () => {
    if (nav.homeNoteId) openDetail(nav.homeNoteId, 'home');
  });
  document.getElementById('btnAddFromHome').addEventListener('click', () => openEditor('new', null, 'home'));
  document.getElementById('navList').addEventListener('click', () => openList());
  document.getElementById('navSettings').addEventListener('click', () => openSettings());

  // --- List ---------------------------------------------------------------
  const listState = { search: '', tags: new Set() };

  function openList() {
    showScreen('list');
    document.getElementById('listSearch').value = listState.search;
    renderList();
  }

  function noteSnippet(text, max) {
    const t = text.replace(/\s+/g, ' ').trim();
    return t.length > max ? t.slice(0, max) + '…' : t;
  }

  function renderList() {
    const tagRow = document.getElementById('listTagFilter');
    tagRow.innerHTML = '';
    allTags().forEach((t) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tagFilterBtn' + (listState.tags.has(t) ? ' selected' : '');
      btn.textContent = t;
      btn.addEventListener('click', () => {
        if (listState.tags.has(t)) listState.tags.delete(t); else listState.tags.add(t);
        renderList();
      });
      tagRow.appendChild(btn);
    });

    const q = listState.search.trim().toLowerCase();
    let results = [...data.notes].sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
    if (q) {
      results = results.filter((n) =>
        n.text.toLowerCase().includes(q) || n.source.toLowerCase().includes(q) || n.myWords.toLowerCase().includes(q)
      );
    }
    if (listState.tags.size) {
      results = results.filter((n) => [...listState.tags].every((t) => n.tags.includes(t)));
    }

    const listEl = document.getElementById('listItems');
    listEl.innerHTML = '';
    document.getElementById('listEmpty').hidden = results.length > 0;
    results.forEach((n) => {
      const el = document.createElement('div');
      el.className = 'listItem';
      const textEl = document.createElement('div');
      textEl.className = 'liText';
      textEl.textContent = noteSnippet(n.text, 80);
      el.appendChild(textEl);
      if (n.source) {
        const srcEl = document.createElement('div');
        srcEl.className = 'liSource';
        srcEl.textContent = n.source;
        el.appendChild(srcEl);
      }
      el.addEventListener('click', () => openDetail(n.id, 'list'));
      listEl.appendChild(el);
    });
  }

  document.getElementById('listSearch').addEventListener('input', (e) => {
    listState.search = e.target.value;
    renderList();
  });
  document.getElementById('backFromList').addEventListener('click', goHome);
  document.getElementById('btnAddFromList').addEventListener('click', () => openEditor('new', null, 'list'));

  // --- Detail ---------------------------------------------------------------
  function openDetail(id, originScreen) {
    nav.detailStack = [];
    nav.detailOrigin = originScreen;
    nav.detailId = id;
    showScreen('detail');
    renderDetail();
  }

  function openDetailChained(id) {
    if (nav.detailId) nav.detailStack.push(nav.detailId);
    nav.detailId = id;
    renderDetail();
  }

  function backFromDetail() {
    if (nav.detailStack.length) {
      nav.detailId = nav.detailStack.pop();
      renderDetail();
    } else if (nav.detailOrigin === 'list') {
      openList();
    } else {
      goHome();
    }
  }

  function renderDetail() {
    const note = findNote(nav.detailId);
    if (!note) { backFromDetail(); return; }
    document.getElementById('detailText').textContent = note.text;
    document.getElementById('detailSource').textContent = note.source || '-';
    document.getElementById('detailMyWords').textContent = note.myWords;
    renderTagPills(document.getElementById('detailTags'), note.tags);

    const linksEl = document.getElementById('detailLinks');
    linksEl.innerHTML = '';
    const linked = note.links.map(findNote).filter(Boolean);
    document.getElementById('detailLinksEmpty').hidden = linked.length > 0;
    linked.forEach((ln) => {
      const el = document.createElement('div');
      el.className = 'detailLinkItem';
      const t = document.createElement('div');
      t.className = 'lText';
      t.textContent = noteSnippet(ln.text, 60);
      el.appendChild(t);
      if (ln.source) {
        const s = document.createElement('div');
        s.className = 'lSource';
        s.textContent = ln.source;
        el.appendChild(s);
      }
      el.addEventListener('click', () => openDetailChained(ln.id));
      linksEl.appendChild(el);
    });
  }

  document.getElementById('backFromDetail').addEventListener('click', backFromDetail);
  document.getElementById('btnEditNote').addEventListener('click', () => {
    openEditor('edit', nav.detailId, 'detail');
  });
  document.getElementById('btnDeleteNote').addEventListener('click', () => {
    const note = findNote(nav.detailId);
    if (!note) return;
    if (!confirm('このノートを削除します。よろしいですか？この操作は取り消せません。')) return;
    deleteNoteById(note.id);
    saveData(data);
    backFromDetail();
  });

  // --- Editor -----------------------------------------------------------
  const editorState = { tags: [], links: [] };
  const editTextEl = document.getElementById('editText');
  const editSourceEl = document.getElementById('editSource');
  const editMyWordsEl = document.getElementById('editMyWords');
  const editTagInputEl = document.getElementById('editTagInput');
  const editLinkSearchEl = document.getElementById('editLinkSearch');
  const btnSaveNote = document.getElementById('btnSaveNote');
  const myWordsHint = document.getElementById('myWordsHint');

  function openEditor(mode, editId, returnScreen) {
    nav.editorMode = mode;
    nav.editorEditId = editId;
    nav.editorReturnScreen = returnScreen;
    document.getElementById('editorTitle').textContent = mode === 'edit' ? '編集' : '追加';

    if (mode === 'edit') {
      const note = findNote(editId);
      editTextEl.value = note.text;
      editSourceEl.value = note.source;
      editMyWordsEl.value = note.myWords;
      editorState.tags = [...note.tags];
      editorState.links = [...note.links];
    } else {
      editTextEl.value = '';
      editSourceEl.value = '';
      editMyWordsEl.value = '';
      editorState.tags = [];
      editorState.links = [];
    }
    editTagInputEl.value = '';
    editLinkSearchEl.value = '';
    hideSuggest(sourceSuggestEl);
    hideSuggest(tagSuggestEl);
    hideLinkResults();
    renderTagChips();
    renderLinkChips();
    updateSaveButtonState();
    showScreen('editor');
  }

  function closeEditor() {
    if (nav.editorReturnScreen === 'detail') {
      showScreen('detail');
      renderDetail();
    } else if (nav.editorReturnScreen === 'list') {
      openList();
    } else {
      goHome();
    }
  }

  function updateSaveButtonState() {
    const ok = editMyWordsEl.value.trim().length > 0;
    btnSaveNote.disabled = !ok;
    myWordsHint.hidden = ok;
  }
  editMyWordsEl.addEventListener('input', updateSaveButtonState);

  document.getElementById('backFromEditor').addEventListener('click', closeEditor);

  btnSaveNote.addEventListener('click', () => {
    const myWords = editMyWordsEl.value.trim();
    if (!myWords) { updateSaveButtonState(); return; }
    const text = editTextEl.value.trim();
    const source = editSourceEl.value.trim();
    const newLinks = [...editorState.links];
    const iso = nowIso();

    let savedId;
    if (nav.editorMode === 'edit') {
      const note = findNote(nav.editorEditId);
      const oldLinks = [...note.links];
      note.text = text;
      note.source = source;
      note.myWords = myWords;
      note.tags = [...editorState.tags];
      note.links = newLinks;
      note.updatedAt = iso;
      applyLinksDiff(note.id, oldLinks, newLinks);
      savedId = note.id;
    } else {
      const id = generateId(data.notes);
      const note = { id, text, source, myWords, tags: [...editorState.tags], links: [...newLinks], createdAt: iso, updatedAt: iso };
      data.notes.push(note);
      applyLinksDiff(id, [], newLinks);
      savedId = id;
    }

    saveData(data);

    if (nav.editorMode === 'new') {
      openDetail(savedId, nav.editorReturnScreen === 'list' ? 'list' : 'home');
    } else {
      nav.detailId = savedId;
      showScreen('detail');
      renderDetail();
    }
  });

  // tag/source autocomplete + chips
  const sourceSuggestEl = document.getElementById('sourceSuggest');
  const tagSuggestEl = document.getElementById('tagSuggest');

  function hideSuggest(el) { el.hidden = true; el.innerHTML = ''; }

  function showSuggestList(el, items, onPick) {
    el.innerHTML = '';
    if (!items.length) { hideSuggest(el); return; }
    items.slice(0, 8).forEach((item) => {
      const li = document.createElement('li');
      li.textContent = item;
      li.addEventListener('mousedown', (e) => { e.preventDefault(); onPick(item); });
      el.appendChild(li);
    });
    el.hidden = false;
  }

  editSourceEl.addEventListener('input', () => {
    const q = editSourceEl.value.trim().toLowerCase();
    if (!q) { hideSuggest(sourceSuggestEl); return; }
    const matches = allSources().filter((s) => s.toLowerCase().startsWith(q) && s.toLowerCase() !== q);
    showSuggestList(sourceSuggestEl, matches, (v) => { editSourceEl.value = v; hideSuggest(sourceSuggestEl); });
  });
  editSourceEl.addEventListener('blur', () => setTimeout(() => hideSuggest(sourceSuggestEl), 150));

  function renderTagChips() {
    const row = document.getElementById('editTagChips');
    row.innerHTML = '';
    editorState.tags.forEach((t) => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      const label = document.createElement('span');
      label.textContent = t;
      chip.appendChild(label);
      const rm = document.createElement('button');
      rm.type = 'button';
      rm.textContent = '×';
      rm.addEventListener('click', () => {
        editorState.tags = editorState.tags.filter((x) => x !== t);
        renderTagChips();
      });
      chip.appendChild(rm);
      row.appendChild(chip);
    });
  }

  function addTag(raw) {
    const t = raw.trim();
    if (!t || editorState.tags.includes(t)) return;
    editorState.tags.push(t);
    renderTagChips();
  }

  editTagInputEl.addEventListener('input', () => {
    const q = editTagInputEl.value.trim().toLowerCase();
    if (!q) { hideSuggest(tagSuggestEl); return; }
    const matches = allTags().filter((t) => t.toLowerCase().startsWith(q) && !editorState.tags.includes(t));
    showSuggestList(tagSuggestEl, matches, (v) => {
      addTag(v);
      editTagInputEl.value = '';
      hideSuggest(tagSuggestEl);
      editTagInputEl.focus();
    });
  });
  editTagInputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      addTag(editTagInputEl.value);
      editTagInputEl.value = '';
      hideSuggest(tagSuggestEl);
    }
  });
  editTagInputEl.addEventListener('blur', () => setTimeout(() => hideSuggest(tagSuggestEl), 150));

  // related-note picker
  const linkResultsEl = document.getElementById('linkSearchResults');
  function hideLinkResults() { linkResultsEl.hidden = true; linkResultsEl.innerHTML = ''; }

  function renderLinkChips() {
    const row = document.getElementById('editLinkChips');
    row.innerHTML = '';
    editorState.links.map(findNote).filter(Boolean).forEach((n) => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      const label = document.createElement('span');
      label.textContent = noteSnippet(n.text, 24);
      chip.appendChild(label);
      const rm = document.createElement('button');
      rm.type = 'button';
      rm.textContent = '×';
      rm.addEventListener('click', () => {
        editorState.links = editorState.links.filter((id) => id !== n.id);
        renderLinkChips();
      });
      chip.appendChild(rm);
      row.appendChild(chip);
    });
  }

  editLinkSearchEl.addEventListener('input', () => {
    const q = editLinkSearchEl.value.trim().toLowerCase();
    if (!q) { hideLinkResults(); return; }
    const excludeId = nav.editorMode === 'edit' ? nav.editorEditId : null;
    const matches = data.notes.filter((n) =>
      n.id !== excludeId &&
      !editorState.links.includes(n.id) &&
      (n.text.toLowerCase().includes(q) || n.source.toLowerCase().includes(q) || n.myWords.toLowerCase().includes(q))
    ).slice(0, 10);
    linkResultsEl.innerHTML = '';
    if (!matches.length) { hideLinkResults(); return; }
    matches.forEach((n) => {
      const item = document.createElement('div');
      item.className = 'linkResultItem';
      const t = document.createElement('div');
      t.className = 'linkResultText';
      t.textContent = noteSnippet(n.text, 50);
      item.appendChild(t);
      if (n.source) {
        const s = document.createElement('div');
        s.className = 'linkResultSource';
        s.textContent = n.source;
        item.appendChild(s);
      }
      item.addEventListener('mousedown', (e) => {
        e.preventDefault();
        editorState.links.push(n.id);
        renderLinkChips();
        editLinkSearchEl.value = '';
        hideLinkResults();
      });
      linkResultsEl.appendChild(item);
    });
    linkResultsEl.hidden = false;
  });
  editLinkSearchEl.addEventListener('blur', () => setTimeout(hideLinkResults, 150));

  // --- Settings ---------------------------------------------------------
  function openSettings() {
    showScreen('settings');
    document.getElementById('ghTokenInput').value = getGhToken();
    document.getElementById('statNoteCount').textContent = data.notes.length;
    document.getElementById('statTagCount').textContent = allTags().length;
    const lastSync = localStorage.getItem(LAST_SYNC_KEY);
    document.getElementById('statLastSync').textContent = lastSync ? formatDateTime(lastSync) : '-';
  }

  document.getElementById('backFromSettings').addEventListener('click', goHome);

  document.getElementById('btnSaveGhToken').addEventListener('click', () => {
    const v = document.getElementById('ghTokenInput').value.trim();
    if (v) {
      localStorage.setItem(GH_TOKEN_KEY, v);
      alert('保存しました');
      syncNow().then(() => openSettings());
    } else {
      localStorage.removeItem(GH_TOKEN_KEY);
      setSyncStatus('off');
      alert('保存しました');
    }
  });

  document.getElementById('btnSyncNow').addEventListener('click', () => {
    syncNow().then(() => openSettings());
  });

  document.getElementById('btnExport').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    a.href = url;
    a.download = `kotoba_data_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  });

  document.getElementById('importFileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = normalizeData(JSON.parse(text));
      if (!parsed) throw new Error('invalid shape');
      if (!confirm('現在のデータを、読み込んだ内容で上書きします。よろしいですか？')) return;
      data = parsed;
      persistLocal(data);
      await forcePush();
      openSettings();
      alert('インポートしました');
    } catch (err) {
      alert('JSONの読み込みに失敗しました');
    }
  });

  // --- boot ---------------------------------------------------------------
  goHome();
  syncNow();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') syncNow();
  });
})();
</script>
</body>
</html>
